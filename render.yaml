services:
  - type: web
    name: shop-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --workers 2 --timeout 60
    healthCheckPath: /health/
    envVars:
      - { key: DEBUG, value: "False" }
      - { key: SECURE_SSL, value: "true" }
      - { key: PYTHON_VERSION, value: "3.12.3" }
      - { key: SECRET_KEY, generateValue: true }
      - { key: DATABASE_URL, sync: false }
      - { key: ALLOWED_HOSTS, sync: false }
      - { key: CORS_ALLOWED_ORIGINS, sync: false }
      - { key: FRONTEND_URL, sync: false }
      - { key: PAYMENT_KEY_ID, sync: false }
      - { key: PAYMENT_KEY_SECRET, sync: false }
      - { key: PAYMENT_WEBHOOK_SECRET, sync: false }
      - { key: GEMINI_API_KEY, sync: false }
      - { key: CLOUDINARY_CLOUD_NAME, sync: false }
      - { key: CLOUDINARY_API_KEY, sync: false }
      - { key: CLOUDINARY_API_SECRET, sync: false }
  # Cancels unpaid orders and returns their stock. Render cron jobs are a PAID feature; on a free setup run
  # `python manage.py expire_pending_orders` from GitHub Actions on a schedule or an external cron instead.
  # - type: cron
  #   name: expire-pending-orders
  #   runtime: python
  #   rootDir: backend
  #   schedule: "*/15 * * * *"
  #   buildCommand: pip install -r requirements.txt
  #   startCommand: python manage.py expire_pending_orders --minutes 30
