x-backend: &backend
  build: ./backend
  env_file: [.env]
  environment:
    DATABASE_URL: postgres://shop:shop@db:5432/shop
    REDIS_URL: redis://redis:6379/0
    ALLOWED_HOSTS: localhost,127.0.0.1,backend
    CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174
  depends_on: { db: { condition: service_healthy }, redis: { condition: service_healthy } }

services:
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_DB: shop, POSTGRES_USER: shop, POSTGRES_PASSWORD: shop }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U shop"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }
  backend:
    <<: *backend
    ports: ["8000:8000"]
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health/')"], interval: 10s, retries: 10 }
  worker:
    <<: *backend
    command: celery -A config worker -l info --concurrency=1
  storefront:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
  admin:
    build: ./admin
    ports: ["5174:80"]
    depends_on: [backend]
volumes: { pgdata: {} }
